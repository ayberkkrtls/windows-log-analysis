title: Security Audit Log Was Cleared (Anti-Forensics)
id: 5e6f7a8b-9c0d-41e2-8f3a-4b5c6d7e8f9a
status: stable
description: |
  Detects Event ID 1102, generated whenever the Windows Security event log
  is cleared. This is one of the strongest single-event anti-forensics
  indicators and should always be treated as high severity.
references:
    - https://github.com/ayberkkrtls/windows-log-analysis/blob/main/logs/1102-audit-log-cleared.md
author: ayberkkrtls (windows-log-analysis)
date: 2026/07/16
tags:
    - attack.defense_evasion
    - attack.t1070.001
logsource:
    product: windows
    service: security
detection:
    selection:
        EventID: 1102
    condition: selection
fields:
    - SubjectUserName
    - SubjectDomainName
falsepositives:
    - Authorized log rotation/maintenance by IT during scheduled windows (rare, should still be verified).
level: critical
